<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SolarEdge - TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
        }

        /* ===== HEADER ===== */
        .header {
            height: 6vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5vw;
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 2px solid #00d4ff;
            font-size: 1.5vh;
            white-space: nowrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.5vw;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 0.3vw;
        }

        /* ===== KPI GRID ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1vh;
            height: 40vh;
            padding: 1vh 1.5vw;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.8vh;
            padding: 1.5vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .kpi-icon {
            font-size: 2.5vh;
            margin-bottom: 0.5vh;
        }

        .kpi-label {
            font-size: 1.6vh;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.7;
            margin-bottom: 0.5vh;
        }

        .kpi-value {
            font-size: 5.5vh;
            font-weight: 700;
            line-height: 1;
        }

        .kpi-unit {
            font-size: 1.8vh;
            opacity: 0.6;
            margin-top: 0.3vh;
        }

        .kpi-sub {
            font-size: 1.2vh;
            opacity: 0.5;
            margin-top: 0.3vh;
        }

        /* Colori */
        .kpi-orange { color: #ff6b35; }
        .kpi-green { color: #00ff88; }
        .kpi-cyan { color: #00d4ff; }
        .kpi-lime { color: #ccff00; }

        /* ===== CHART SECTION ===== */
        .chart-section {
            height: 48vh;
            padding: 0 1.5vw 1vh;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5vh;
            height: 3vh;
        }

        .chart-title {
            font-size: 1.6vh;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .chart-update {
            font-size: 1.2vh;
            opacity: 0.5;
        }

        .chart-container {
            flex: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0.8vh;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        #productionChart {
            width: 100%;
            height: 100%;
        }

        .error-msg {
            color: #ff6b35;
            font-size: 1.4vh;
            text-align: center;
            padding: 1vh;
        }

        /* ===== LOADING ===== */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2vh;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <span>🏭</span>
            <span id="siteName">Via Primo Maggio 8 - Barbara (AN) | 658.92 kWp</span>
        </div>
        <div class="header-right">
            <div class="header-item"><span>☀️</span><span id="weather">Sunny</span></div>
            <div class="header-item"><span>💧</span><span id="humidity">49%</span></div>
            <div class="header-item"><span>💨</span><span id="wind">8.9 km/h</span></div>
        </div>
    </div>

    <!-- KPI GRID -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon">⚡</div>
            <div class="kpi-label">Potenza Attuale</div>
            <div class="kpi-value kpi-orange" id="currentPower">---</div>
            <div class="kpi-unit">kW</div>
            <div class="kpi-sub" id="powerSub">---</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon">📅</div>
            <div class="kpi-label">Energia Oggi</div>
            <div class="kpi-value kpi-green" id="energyToday">---</div>
            <div class="kpi-unit">kWh</div>
            <div class="kpi-sub" id="todaySub">---</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon">🏆</div>
            <div class="kpi-label">Energia Totale</div>
            <div class="kpi-value kpi-cyan" id="energyTotal">---</div>
            <div class="kpi-unit">MWh</div>
            <div class="kpi-sub" id="totalSub">---</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon">🌱</div>
            <div class="kpi-label">CO₂ Risparmiata</div>
            <div class="kpi-value kpi-lime" id="co2Saved">---</div>
            <div class="kpi-unit">kg</div>
            <div class="kpi-sub" id="co2Sub">---</div>
        </div>
    </div>

    <!-- CHART -->
    <div class="chart-section">
        <div class="chart-header">
            <div class="chart-title">Produzione Oraria - Oggi</div>
            <div class="chart-update" id="lastUpdate">Dati fino alle --:--</div>
        </div>
        <div class="chart-container">
            <canvas id="productionChart"></canvas>
        </div>
    </div>

    <div class="loading" id="loading">Caricamento...</div>

    <script>
        // ===== CONFIG =====
        const API_KEY = 'R32EGC7MEDO2B47EAS4S59NM5EEM1RYX';
        const SITE_ID = '4858098';

        // ===== FETCH =====
        async function loadData() {
            try {
                // Chiamata API esatta come nel codice funzionante
                const url = `https://monitoringapi.solaredge.com/sites/${SITE_ID}/overview?api_key=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('Risposta API:', data); // Debug
                
                if (data.overview) {
                    updateKPI(data.overview);
                    document.getElementById('loading').style.display = 'none';
                } else {
                    throw new Error('Dati overview mancanti');
                }
            } catch (err) {
                console.error('Errore:', err);
                document.getElementById('loading').innerHTML = '<span class="error-msg">Errore caricamento dati - ricaricare pagina</span>';
            }
        }

        // ===== UPDATE KPI =====
        function updateKPI(overview) {
            // Potenza attuale
            const power = overview.currentPower?.power || 0;
            document.getElementById('currentPower').textContent = power.toFixed(1);
            document.getElementById('powerSub').textContent = power > 0 ? 'Produzione attiva' : 'Nessuna produzione';
            
            // Energia oggi
            const today = overview.lastDayData?.energy || 0;
            document.getElementById('energyToday').textContent = today.toFixed(1);
            document.getElementById('todaySub').textContent = (today / 1000).toFixed(3) + ' MWh';
            
            // Energia totale
            const total = overview.lifeTimeData?.energy || 0;
            document.getElementById('energyTotal').textContent = (total / 1000000).toFixed(2);
            document.getElementById('totalSub').textContent = (total / 1000).toFixed(1) + ' MWh';
            
            // CO2
            const co2 = total * 0.0004;
            document.getElementById('co2Saved').textContent = co2.toFixed(3);
            document.getElementById('co2Sub').textContent = '≈ ' + (co2 / 10).toFixed(1) + ' alberi';
            
            // Timestamp
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 'Aggiornato: ' + 
                now.getHours().toString().padStart(2,'0') + ':' + 
                now.getMinutes().toString().padStart(2,'0');
        }

        // ===== CHART =====
        function drawChart() {
            const canvas = document.getElementById('productionChart');
            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            const w = canvas.width;
            const h = canvas.height;
            
            // Dati di esempio (da sostituire con dati reali API)
            const hours = ['06','07','08','09','10','11','12','13','14','15','16','17','18'];
            const values = [0,0,15,45,85,120,150,170,160,130,90,40,10];
            const maxVal = Math.max(...values) * 1.2;
            
            // Sfondo
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            ctx.fillRect(0, 0, w, h);
            
            // Barre
            const barWidth = (w - 60) / hours.length * 0.7;
            const spacing = (w - 60) / hours.length;
            
            hours.forEach((hour, i) => {
                const barHeight = (values[i] / maxVal) * (h - 40);
                const x = 40 + i * spacing;
                const y = h - 25 - barHeight;
                
                const gradient = ctx.createLinearGradient(0, y, 0, h - 25);
                gradient.addColorStop(0, '#00ff88');
                gradient.addColorStop(1, '#00d4ff');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, barWidth, barHeight);
                
                // Etichetta
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.font = Math.max(10, h * 0.035) + 'px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(hour, x + barWidth/2, h - 8);
            });
        }

        // ===== INIT =====
        window.addEventListener('load', () => {
            loadData();
            drawChart();
            setInterval(loadData, 300000); // 5 min
        });
        
        window.addEventListener('resize', drawChart);
    </script>
</body>
</html>

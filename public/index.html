<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SolarEdge - TV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0e27;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
        }

        /* ===== HEADER ===== */
        .header {
            height: 7vh;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2vw;
            background: rgba(10, 14, 39, 0.98);
            border-bottom: 2px solid #00d4ff;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1vw;
            font-size: 1.8vh;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50vw;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 2vw;
            font-size: 1.6vh;
        }

        .header-item {
            display: flex;
            align-items: center;
            gap: 0.5vw;
            white-space: nowrap;
        }

        .header-icon {
            font-size: 2vh;
        }

        /* ===== KPI GRID ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1.5vh;
            height: 42vh;
            padding: 1.5vh 2vw;
            flex-shrink: 0;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1.2vh;
            padding: 2vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .kpi-icon {
            font-size: 3vh;
            margin-bottom: 1vh;
            opacity: 0.9;
        }

        .kpi-label {
            font-size: 1.8vh;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.7;
            margin-bottom: 1vh;
            text-align: center;
        }

        .kpi-value {
            font-size: 6vh;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5vh;
        }

        .kpi-unit {
            font-size: 2vh;
            opacity: 0.6;
        }

        .kpi-sub {
            font-size: 1.4vh;
            opacity: 0.5;
            margin-top: 0.5vh;
        }

        /* Colori KPI */
        .kpi-orange .kpi-value { color: #ff6b35; }
        .kpi-green .kpi-value { color: #00ff88; }
        .kpi-cyan .kpi-value { color: #00d4ff; }
        .kpi-lime .kpi-value { color: #ccff00; }

        /* ===== CHART SECTION ===== */
        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 2vw 1.5vh;
            min-height: 0;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1vh;
            flex-shrink: 0;
        }

        .chart-title {
            font-size: 2vh;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

        .chart-update {
            font-size: 1.4vh;
            opacity: 0.5;
        }

        .chart-container {
            flex: 1;
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 1vh;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            min-height: 0;
        }

        #productionChart {
            width: 100%;
            height: 100%;
        }

        /* ===== LOADING / ERROR ===== */
        .loading, .error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2vh;
            z-index: 1000;
        }

        .error {
            color: #ff6b35;
        }

        /* ===== RESPONSIVE TV SAFE AREA ===== */
        @media screen and (min-width: 1920px) {
            .kpi-value { font-size: 5vh; }
            .kpi-label { font-size: 1.6vh; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <span class="header-icon">🏭</span>
            <span id="siteName">Via Primo Maggio 8 - Barbara (AN) Italy | Impianto Fotovoltaico 658.92 kWp</span>
        </div>
        <div class="header-right">
            <div class="header-item">
                <span class="header-icon">☀️</span>
                <span id="weatherStatus">Sunny</span>
            </div>
            <div class="header-item">
                <span class="header-icon">💧</span>
                <span id="humidity">49%</span>
            </div>
            <div class="header-item">
                <span class="header-icon">💨</span>
                <span id="windSpeed">8.9 km/h</span>
            </div>
        </div>
    </div>

    <!-- KPI GRID -->
    <div class="kpi-grid">
        <div class="kpi-card kpi-orange">
            <div class="kpi-icon">⚡</div>
            <div class="kpi-label">Potenza Attuale</div>
            <div class="kpi-value" id="currentPower">---</div>
            <div class="kpi-unit">kW</div>
            <div class="kpi-sub" id="powerSub">---</div>
        </div>
        <div class="kpi-card kpi-green">
            <div class="kpi-icon">📅</div>
            <div class="kpi-label">Energia Oggi</div>
            <div class="kpi-value" id="energyToday">---</div>
            <div class="kpi-unit">kWh</div>
            <div class="kpi-sub" id="todaySub">---</div>
        </div>
        <div class="kpi-card kpi-cyan">
            <div class="kpi-icon">🏆</div>
            <div class="kpi-label">Energia Totale</div>
            <div class="kpi-value" id="energyTotal">---</div>
            <div class="kpi-unit">MWh</div>
            <div class="kpi-sub" id="totalSub">---</div>
        </div>
        <div class="kpi-card kpi-lime">
            <div class="kpi-icon">🌱</div>
            <div class="kpi-label">CO₂ Risparmiata</div>
            <div class="kpi-value" id="co2Saved">---</div>
            <div class="kpi-unit">kg</div>
            <div class="kpi-sub" id="co2Sub">---</div>
        </div>
    </div>

    <!-- CHART SECTION -->
    <div class="chart-section">
        <div class="chart-header">
            <div class="chart-title">Produzione Oraria - Oggi</div>
            <div class="chart-update" id="lastUpdate">Dati fino alle --:--</div>
        </div>
        <div class="chart-container">
            <canvas id="productionChart"></canvas>
        </div>
    </div>

    <div class="loading" id="loading">Caricamento dati...</div>

    <script>
        // ===== CONFIGURAZIONE =====
        const API_KEY = 'R32EGC7MEDO2B47EAS4S59NM5EEM1RYX';
        const SITE_ID = '4858098';
        const API_BASE = 'https://monitoringapi.solaredge.com/sites';

        // ===== FETCH DATI =====
        async function fetchData() {
            try {
                const response = await fetch(`${API_BASE}/${SITE_ID}/overview?api_key=${API_KEY}`);
                const data = await response.json();
                
                if (data.overview) {
                    updateDashboard(data.overview);
                }
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Errore fetch:', error);
                document.getElementById('loading').textContent = 'Errore caricamento dati';
                document.getElementById('loading').className = 'error';
            }
        }

        // ===== AGGIORNA DASHBOARD =====
        function updateDashboard(data) {
            // Potenza attuale
            document.getElementById('currentPower').textContent = data.currentPower ? data.currentPower.toFixed(1) : '0.0';
            document.getElementById('powerSub').textContent = data.currentPower ? 'Produzione in corso' : 'Nessuna produzione';
            
            // Energia oggi
            document.getElementById('energyToday').textContent = data.lastDayData ? data.lastDayData.energy.toFixed(1) : '0.0';
            document.getElementById('todaySub').textContent = data.lastDayData ? (data.lastDayData.energy / 1000).toFixed(3) + ' MWh' : '0 MWh';
            
            // Energia totale
            document.getElementById('energyTotal').textContent = data.lifeTimeData ? (data.lifeTimeData.energy / 1000000).toFixed(2) : '0.00';
            document.getElementById('totalSub').textContent = data.lifeTimeData ? (data.lifeTimeData.energy / 1000).toFixed(1) + ' MWh' : '0 MWh';
            
            // CO2
            const co2 = data.lifeTimeData ? (data.lifeTimeData.energy * 0.0004) : 0;
            document.getElementById('co2Saved').textContent = co2.toFixed(3);
            document.getElementById('co2Sub').textContent = '≈ ' + (co2 / 10).toFixed(1) + ' alberi equivalenti';
            
            // Timestamp
            const now = new Date();
            document.getElementById('lastUpdate').textContent = 'Dati fino alle ' + now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        // ===== GRAFICO SEMPLICE (CANVAS) =====
        function drawChart() {
            const canvas = document.getElementById('productionChart');
            const ctx = canvas.getContext('2d');
            
            // Adatta canvas al container
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            const w = canvas.width;
            const h = canvas.height;
            
            // Dati di esempio (sostituire con dati reali API)
            const hours = ['06', '07', '08', '09', '10', '11', '12', '13', '14', '15', '16', '17', '18'];
            const values = [0, 0, 15, 45, 85, 120, 150, 170, 160, 130, 90, 40, 10];
            const maxVal = Math.max(...values) * 1.2;
            
            // Sfondo
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            ctx.fillRect(0, 0, w, h);
            
            // Griglia
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = h - 30 - (i * (h - 50) / 5);
                ctx.beginPath();
                ctx.moveTo(40, y);
                ctx.lineTo(w - 20, y);
                ctx.stroke();
            }
            
            // Barre
            const barWidth = (w - 80) / hours.length * 0.7;
            const spacing = (w - 80) / hours.length;
            
            hours.forEach((hour, i) => {
                const barHeight = (values[i] / maxVal) * (h - 60);
                const x = 50 + i * spacing;
                const y = h - 30 - barHeight;
                
                // Gradiente barra
                const gradient = ctx.createLinearGradient(0, y, 0, h - 30);
                gradient.addColorStop(0, '#00ff88');
                gradient.addColorStop(1, '#00d4ff');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(x, y, barWidth, barHeight);
                
                // Etichetta ora
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.font = `${Math.max(10, h * 0.03)}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(hour, x + barWidth/2, h - 10);
            });
            
            // Titolo asse Y
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = `${Math.max(10, h * 0.025)}px Arial`;
            ctx.textAlign = 'left';
            ctx.fillText('kWh', 10, 20);
        }

        // ===== INIZIALIZZAZIONE =====
        window.addEventListener('load', () => {
            fetchData();
            drawChart();
            setInterval(fetchData, 300000); // Refresh ogni 5 min
        });

        // Ridisegna grafico al resize
        window.addEventListener('resize', drawChart);
    </script>
</body>
</html>
